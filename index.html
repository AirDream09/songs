<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songblog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   KONFIGURATION — hier deine Songs eintragen
   =========================================================== */
</style>
<script>
/*
  Trage hier deine Songs ein. Für jeden Song:
  - title:   Songtitel
  - album:   Albumname (Songs mit gleichem Album werden gruppiert & sortiert)
  - date:    "YYYY-MM-DD" (bestimmt Reihenfolge "Neueste zuerst")
  - cover:   Bild-Pfad relativ zu dieser HTML-Datei (z.B. "covers/album1.jpg"), oder leer lassen
  - audio:   Pfad relativ zu dieser HTML-Datei, z.B. "songs/track.mp3"
  - desc:    kurzer Text/Liner Notes (optional, kann leer sein "")

  Wichtig: Diese HTML-Datei muss im selben Repo liegen wie die Song-Ordner,
  z.B. im Root, und die Pfade sind relativ dazu. Legst du sie z.B. neben
  einen Ordner "songs/", reicht "songs/lara_croft.mp3" als audio-Pfad.
*/
const SONGS = [
  {
    title: "Beispiel Track 1",
    album: "Erstes Album",
    date: "2026-06-01",
    cover: "",
    audio: "songs/track1.mp3",
    desc: "Kurze Notiz zum Song, z.B. wie er entstanden ist."
  },
  {
    title: "Beispiel Track 2",
    album: "Erstes Album",
    date: "2026-06-10",
    cover: "",
    audio: "songs/track2.wav",
    desc: ""
  },
  {
    title: "Lara Croft",
    album: "Singles",
    date: "2026-07-20",
    cover: "",
    audio: "songs/lara_croft.mp3",
    desc: "Erste Version, ungemastert."
  }
];

const PROFILE = {
  name: "Dein Name",
  handle: "@deinname",
  bio: "Selbstgemachte Songs, direkt aus dem Homestudio.",
  avatar: "",
  github: "https://github.com/USERNAME/REPO"
};
</script>
<style>
:root{
  --bg:#14151c;
  --surface:#1b1d27;
  --surface-2:#232633;
  --border:#2c2f3d;
  --text:#ece9e0;
  --text-dim:#96959f;
  --accent:#e6a94f;
  --accent-ink:#2a1c05;
  --accent-2:#4fb8a6;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Work Sans', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  margin:0;
}
.mono{ font-family:'Space Mono', monospace; }

a{ color:var(--accent); }

.layout{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  max-width:1100px;
  margin:0 auto;
  min-height:100vh;
}
@media (max-width:800px){
  .layout{ grid-template-columns:1fr; }
}

/* ---------- Sidebar ---------- */
.sidebar{
  border-right:1px solid var(--border);
  padding:28px 22px;
  position:sticky;
  top:0;
  align-self:start;
  height:100vh;
  overflow-y:auto;
}
@media (max-width:800px){
  .sidebar{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
}
.avatar{
  width:64px;height:64px;border-radius:50%;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:22px;
  color:var(--accent);
  border:1px solid var(--border);
  overflow:hidden;
  margin-bottom:14px;
}
.avatar img{ width:100%;height:100%;object-fit:cover; }
.profile-name{ font-size:19px; }
.profile-handle{ color:var(--text-dim); font-size:13px; margin-top:2px; }
.profile-bio{ font-size:14px; line-height:1.55; color:var(--text-dim); margin:16px 0 20px; }

.stats{
  display:flex; gap:18px; margin-bottom:20px;
}
.stat b{ display:block; font-family:'Space Grotesk'; font-size:18px; color:var(--text); }
.stat span{ font-size:12px; color:var(--text-dim); }

.gh-link{
  display:inline-flex; align-items:center; gap:8px;
  font-size:13px; color:var(--text);
  border:1px solid var(--border); border-radius:8px;
  padding:8px 12px; text-decoration:none;
}
.gh-link:hover{ border-color:var(--accent); color:var(--accent); }

/* ---------- Main feed ---------- */
.main{ padding:28px 22px 140px; min-width:0; }
.feed-head{ margin-bottom:18px; }
.feed-head h1{ font-size:24px; margin-bottom:6px; }
.feed-head p{ color:var(--text-dim); font-size:13px; margin:0; }

.controls{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  margin:18px 0 22px;
}
.search{
  flex:1; min-width:160px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text);
  font-family:'Work Sans';
  font-size:13px;
}
.search:focus{ outline:none; border-color:var(--accent); }
select{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  padding:9px 10px;
  font-family:'Work Sans';
  font-size:13px;
}
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
.chip{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  padding:6px 13px;
  border-radius:99px;
  font-size:12.5px;
  cursor:pointer;
  user-select:none;
}
.chip.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
  font-weight:600;
}

.feed{ display:flex; flex-direction:column; gap:16px; }

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:border-color .15s;
}
.card.playing{ border-color:var(--accent); }
.card-body{ display:flex; gap:14px; padding:16px; }
.cover{
  width:84px;height:84px;border-radius:10px;flex:none;
  background:var(--surface-2);
  background-size:cover; background-position:center;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);
  font-family:'Space Grotesk'; font-weight:700; font-size:11px;
  border:1px solid var(--border);
}
.card-info{ flex:1; min-width:0; }
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card-title{ font-size:16px; margin-bottom:3px; }
.card-meta{ font-size:12.5px; color:var(--text-dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.badge{
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:2px 9px;
  border-radius:99px;
  font-size:11.5px;
}
.track-idx{ color:var(--text-dim); font-size:12px; flex:none; }
.card-desc{ font-size:13px; color:var(--text-dim); margin-top:8px; line-height:1.5; }

.player-row{
  display:flex; align-items:center; gap:10px; margin-top:12px;
}
.playbtn{
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer; flex:none;
  font-size:13px;
}
.card.playing .playbtn{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

.seek{
  flex:1; height:26px; position:relative; cursor:pointer;
}
.seek-track{
  position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%);
  background:var(--surface-2); border-radius:99px; overflow:hidden;
}
.seek-fill{ height:100%; width:0%; background:var(--accent); }
.time{ font-size:11px; color:var(--text-dim); flex:none; min-width:66px; text-align:right; }

.dl{
  color:var(--text-dim);
  border:1px solid var(--border);
  border-radius:8px;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none; flex:none;
  font-size:14px;
}
.dl:hover{ color:var(--accent); border-color:var(--accent); }

.empty{
  text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;
}

/* ---------- Persistenter Mini-Player ---------- */
.miniplayer{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:none;
  padding:10px 18px;
  z-index:50;
}
.miniplayer.show{ display:block; }
.mp-inner{
  max-width:1100px; margin:0 auto;
  display:flex; align-items:center; gap:14px;
}
.mp-cover{
  width:40px;height:40px;border-radius:8px;flex:none;
  background:var(--surface-2); background-size:cover; background-position:center;
  border:1px solid var(--border);
}
.mp-info{ min-width:120px; }
.mp-title{ font-size:13px; font-weight:600; }
.mp-album{ font-size:11px; color:var(--text-dim); }
.reel{
  width:16px;height:16px;border-radius:50%;
  border:2px solid var(--accent);
  border-top-color:transparent;
  flex:none;
  animation:spin 1s linear infinite;
}
.reel.paused{ animation-play-state:paused; }
@keyframes spin{ to{ transform:rotate(360deg); } }

@media (max-width:600px){
  .mp-info{ display:none; }
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="avatar" id="avatar">?</div>
    <div class="profile-name display" id="p-name"></div>
    <div class="profile-handle mono" id="p-handle"></div>
    <div class="profile-bio" id="p-bio"></div>
    <div class="stats">
      <div class="stat"><b id="stat-songs">0</b><span>Songs</span></div>
      <div class="stat"><b id="stat-albums">0</b><span>Alben</span></div>
    </div>
    <a class="gh-link" id="p-github" href="#" target="_blank" rel="noopener">↗ Quelle auf GitHub</a>
  </aside>

  <main class="main">
    <div class="feed-head">
      <h1>Songs</h1>
      <p>Alle Tracks, direkt von GitHub gestreamt.</p>
    </div>

    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Song oder Album suchen…">
      <select id="sort">
        <option value="new">Neueste zuerst</option>
        <option value="old">Älteste zuerst</option>
        <option value="az">A–Z</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>

    <div class="feed" id="feed"></div>
    <div class="empty" id="empty" style="display:none;">Keine Songs gefunden.</div>
  </main>
</div>

<div class="miniplayer" id="miniplayer">
  <div class="mp-inner">
    <div class="reel paused" id="mp-reel"></div>
    <div class="mp-cover" id="mp-cover"></div>
    <div class="mp-info">
      <div class="mp-title" id="mp-title"></div>
      <div class="mp-album" id="mp-album"></div>
    </div>
    <div class="playbtn" id="mp-playbtn">▶</div>
    <div class="seek" id="mp-seek">
      <div class="seek-track"><div class="seek-fill" id="mp-fill"></div></div>
    </div>
    <div class="time mono" id="mp-time">0:00 / 0:00</div>
  </div>
</div>

<div id="error-box" style="display:none; position:fixed; left:18px; right:18px; bottom:70px; max-width:1064px; margin:0 auto; background:#2a1414; border:1px solid #7a2f2f; color:#f3d4d4; padding:12px 14px; border-radius:10px; font-size:12.5px; line-height:1.6; z-index:60;"></div>

<audio id="audio" preload="none"></audio>

<script>
const audio = document.getElementById('audio');
let currentIndex = null;
let activeAlbum = "Alle";
let searchTerm = "";
let sortMode = "new";

function fmtTime(s){
  if(!isFinite(s)) return "0:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return m+":"+sec;
}
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('de-DE', {day:'2-digit', month:'short', year:'numeric'});
}
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function setupProfile(){
  document.getElementById('p-name').textContent = PROFILE.name;
  document.getElementById('p-handle').textContent = PROFILE.handle;
  document.getElementById('p-bio').textContent = PROFILE.bio;
  const av = document.getElementById('avatar');
  if(PROFILE.avatar){
    av.innerHTML = '<img src="'+PROFILE.avatar+'" alt="">';
  } else {
    av.textContent = initials(PROFILE.name || "?");
  }
  const gh = document.getElementById('p-github');
  if(PROFILE.github){ gh.href = PROFILE.github; } else { gh.style.display = 'none'; }

  document.getElementById('stat-songs').textContent = SONGS.length;
  const albums = new Set(SONGS.map(s=>s.album));
  document.getElementById('stat-albums').textContent = albums.size;
}

function setupChips(){
  const albums = ["Alle", ...new Set(SONGS.map(s=>s.album))];
  const wrap = document.getElementById('chips');
  wrap.innerHTML = "";
  albums.forEach(a=>{
    const c = document.createElement('div');
    c.className = 'chip' + (a===activeAlbum ? ' active' : '');
    c.textContent = a;
    c.onclick = ()=>{ activeAlbum = a; render(); };
    wrap.appendChild(c);
  });
}

function getFiltered(){
  let list = SONGS.map((s,i)=>({...s, _i:i}));
  if(activeAlbum !== "Alle"){
    list = list.filter(s=>s.album===activeAlbum);
  }
  if(searchTerm.trim()){
    const q = searchTerm.toLowerCase();
    list = list.filter(s=> s.title.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
  }
  if(sortMode==="new") list.sort((a,b)=> new Date(b.date) - new Date(a.date));
  if(sortMode==="old") list.sort((a,b)=> new Date(a.date) - new Date(b.date));
  if(sortMode==="az") list.sort((a,b)=> a.title.localeCompare(b.title,'de'));
  return list;
}

function coverStyle(url){
  return url ? `background-image:url('${url}')` : '';
}

function render(){
  setupChips();
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  const list = getFiltered();
  feed.innerHTML = "";
  empty.style.display = list.length ? 'none' : 'block';

  list.forEach((s)=>{
    const card = document.createElement('div');
    card.className = 'card' + (currentIndex===s._i ? ' playing' : '');
    card.innerHTML = `
      <div class="card-body">
        <div class="cover" style="${coverStyle(s.cover)}">${s.cover ? '' : initials(s.title)}</div>
        <div class="card-info">
          <div class="card-top">
            <div>
              <div class="card-title display">${s.title}</div>
              <div class="card-meta">
                <span class="badge">${s.album}</span>
                <span class="mono">${fmtDate(s.date)}</span>
              </div>
            </div>
            <div class="track-idx mono">#${String(s._i+1).padStart(3,'0')}</div>
          </div>
          ${s.desc ? `<div class="card-desc">${s.desc}</div>` : ''}
          <div class="player-row">
            <div class="playbtn" data-i="${s._i}">${currentIndex===s._i && !audio.paused ? '❚❚' : '▶'}</div>
            <div class="seek" data-i="${s._i}">
              <div class="seek-track"><div class="seek-fill" style="width:${currentIndex===s._i ? progressPct()+'%' : '0%'}"></div></div>
            </div>
            <div class="time mono">${currentIndex===s._i ? fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration) : '0:00'}</div>
            <a class="dl" href="${s.audio}" download title="Herunterladen">↓</a>
          </div>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });

  feed.querySelectorAll('.playbtn').forEach(btn=>{
    btn.onclick = ()=> togglePlay(parseInt(btn.dataset.i));
  });
  feed.querySelectorAll('.seek').forEach(el=>{
    el.onclick = (e)=>{
      const i = parseInt(el.dataset.i);
      if(currentIndex!==i){ playTrack(i); }
      seekFromEvent(e, el);
    };
  });
}

function progressPct(){
  if(!audio.duration) return 0;
  return (audio.currentTime/audio.duration)*100;
}

function seekFromEvent(e, el){
  const rect = el.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width));
  if(audio.duration) audio.currentTime = pct*audio.duration;
}

function resolveAudioSrc(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

function playTrack(i){
  const s = SONGS[i];
  clearError();
  audio.src = resolveAudioSrc(s.audio);
  audio.play().catch(err=>{
    showError(s, err.message);
  });
  currentIndex = i;
  updateMiniplayer(s);
  render();
}

function showError(s, msg){
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  box.innerHTML = `<b>Konnte "${s.title}" nicht laden.</b><br>
    Datei-Pfad: <span class="mono">${s.audio}</span><br>
    Aufgelöst zu: <span class="mono">${new URL(resolveAudioSrc(s.audio), location.href).href}</span><br>
    Fehler: <span class="mono">${msg || 'unbekannt'}</span><br><br>
    Öffne die aufgelöste URL direkt im Browser-Tab. Kommt ein 404 → Dateiname/Pfad/Groß-Kleinschreibung
    stimmt nicht mit dem Repo überein, oder die Datei wurde nicht gepusht (z.B. weil sie über 100&nbsp;MB
    groß ist und ohne Git LFS geblockt wurde).`;
}
function clearError(){
  document.getElementById('error-box').style.display = 'none';
}

audio.addEventListener('error', ()=>{
  if(currentIndex!==null) showError(SONGS[currentIndex], audio.error ? 'Code '+audio.error.code : '');
});

function togglePlay(i){
  if(currentIndex === i){
    if(audio.paused){ audio.play(); } else { audio.pause(); }
  } else {
    playTrack(i);
  }
}

function updateMiniplayer(s){
  const mp = document.getElementById('miniplayer');
  mp.classList.add('show');
  document.getElementById('mp-title').textContent = s.title;
  document.getElementById('mp-album').textContent = s.album;
  const cov = document.getElementById('mp-cover');
  cov.style.backgroundImage = s.cover ? `url('${s.cover}')` : '';
}

document.getElementById('mp-playbtn').onclick = ()=>{
  if(currentIndex===null) return;
  if(audio.paused) audio.play(); else audio.pause();
};
document.getElementById('mp-seek').onclick = (e)=>{
  if(currentIndex===null) return;
  seekFromEvent(e, document.getElementById('mp-seek'));
};

audio.addEventListener('play', ()=>{
  document.getElementById('mp-playbtn').textContent = '❚❚';
  document.getElementById('mp-reel').classList.remove('paused');
  render();
});
audio.addEventListener('pause', ()=>{
  document.getElementById('mp-playbtn').textContent = '▶';
  document.getElementById('mp-reel').classList.add('paused');
  render();
});
audio.addEventListener('timeupdate', ()=>{
  document.getElementById('mp-fill').style.width = progressPct()+'%';
  document.getElementById('mp-time').textContent = fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration);
  const cards = document.querySelectorAll('.card.playing .seek-fill');
  cards.forEach(f=> f.style.width = progressPct()+'%');
  const times = document.querySelectorAll('.card.playing .time');
  times.forEach(t=> t.textContent = fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration));
});
audio.addEventListener('ended', ()=>{
  if(currentIndex!==null && currentIndex < SONGS.length-1){
    playTrack(currentIndex+1);
  }
});

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value; render();
});
document.getElementById('sort').addEventListener('change', (e)=>{
  sortMode = e.target.value; render();
});

setupProfile();
render();
</script>
</body>
</html>
